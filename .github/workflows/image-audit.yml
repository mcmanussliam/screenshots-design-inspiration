name: Audit image dimensions (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-audit.yml'
  workflow_dispatch:
concurrency:
  group: image-dimension-audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the full design archive for a one-time dimension inventory
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate image header decoders
        run: node --test scripts/scan-image-dimensions-test.mjs
      - name: Build source-resolution inventory without altering images
        run: node scripts/scan-image-dimensions.mjs --scan
      - name: Upload reviewed metadata for a repository commit
        uses: actions/upload-artifact@v4
        with:
          name: image-dimensions
          path: data/image-dimensions.json
          retention-days: 7
