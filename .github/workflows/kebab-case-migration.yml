name: One-time kebab-case migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kebab-case-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metadata only (no screenshot downloads)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /site/
            /mcp/
            /.github/
            /**/index.html
            /**/tags.json
            /README.md
            /CONTRIBUTING.md
            /CHANGELOG.md
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete master branch after checking default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          if [ "$default_branch" != "main" ]; then
            echo "::error::Default branch is $default_branch; refusing to delete master."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" >/dev/null 2>&1; then
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/master"; then
              echo "Deleted obsolete master branch." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Cannot delete master automatically; remove it in Settings → Branches."
              echo "Master deletion requires manual action due to branch protection/permissions." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Master branch already absent." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Rewrite Git tree paths and metadata without image uploads
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ github.token }}
        run: node scripts/normalize-repository.mjs --api-migrate
      - name: Dispatch Pages build for migrated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -f ref=main
