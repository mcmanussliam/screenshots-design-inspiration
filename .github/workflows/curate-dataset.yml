name: Stage legacy dataset cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curate-dataset.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/
            /scripts/curate-legacy-data.mjs
            /.github/
            /**/tags.json
            /**/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit proposed clean-up
        run: node scripts/curate-legacy-data.mjs --dry-run
      - name: Stage atomic curation commit without uploading image binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/curate-legacy-data.mjs --stage
