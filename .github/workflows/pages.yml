name: Deploy Open Screens
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'mcp/**'
      - 'design/**'
      - 'data/**'
      - 'scripts/scan-image-dimensions.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source metadata without the image archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            /mcp/
            /data/
            /scripts/normalize-repository.mjs
            /scripts/scan-image-dimensions.mjs
            /scripts/scan-image-dimensions-test.mjs
            /.github/
            /**/index.html
            /**/tags.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue and MCP source
        run: |
          node --test site/scripts/generate-catalog-test.mjs
          node --test scripts/scan-image-dimensions-test.mjs
          node --check mcp/server.mjs
          node scripts/normalize-repository.mjs --check
      - name: Install site dependencies
        run: npm install --prefix site --no-audit --no-fund
      - name: Generate catalogue and build
        run: |
          npm run build --prefix site
          node site/scripts/validate-dataset.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
