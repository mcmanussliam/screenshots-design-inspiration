name: Apply verified image dimensions (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-dimensions.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/
            /scripts/publish-image-dimensions.mjs
            /.github/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified 9,608-image audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-download
          gh run download 42537777526 --repo "$GITHUB_REPOSITORY" -n image-dimensions -D audit-download
          mv audit-download/image-dimensions.json data/image-dimensions.json
      - name: Publish verified metadata as a remote Git commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-image-dimensions.mjs
